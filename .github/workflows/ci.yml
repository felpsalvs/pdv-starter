name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      # dist/ is embedded into the Go binary (see webassets.go), so it
      # must exist before any `go build`/`go vet`/`go test`.
      - run: npm ci
      - run: npm run build

      - run: go vet ./...
      - run: go test ./...
