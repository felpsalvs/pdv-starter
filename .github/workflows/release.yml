name: release

# Builds and publishes a GitHub Release whenever a "v*" tag is pushed
# (e.g. `git tag v0.1.0 && git push origin v0.1.0`). The Go binary in
# cmd/pdv checks this repo's releases on startup and self-updates against
# whatever this workflow publishes — see internal/update.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: goreleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
